# Temporary (issue #163): the narrow diagnostic of tests_vulkan on the hosted runner. Removed before the final push.
name: diag-163
on:
  push:
    branches: [issue-163]
permissions:
  contents: read
jobs:
  diag:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: CMake 4.4.5
        shell: pwsh
        run: |
          python -I tools/build.py --install-cmake "$env:RUNNER_TEMP\cmake"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "PATELLA_CMAKE_DIR=$env:RUNNER_TEMP\cmake" >> $env:GITHUB_ENV
      - name: The runner's Vulkan and integrity
        shell: pwsh
        continue-on-error: true
        run: |
          whoami /groups | Select-String 'Mandatory|BUILTIN\Administrators'
          python -I tools/sandbox.py normal-user -- whoami /groups | Select-String 'Mandatory|BUILTIN\Administrators'
          Get-Item C:\Windows\System32\vulkan-1.dll -ErrorAction Continue | Format-List FullName,Length,@{n='Version';e={$_.VersionInfo.FileVersion}}
          Get-ChildItem Env: | Where-Object { $_.Name -match 'VK_|VULKAN' } | Format-List
          foreach ($k in 'HKLM:\SOFTWARE\Khronos\Vulkan\Drivers','HKLM:\SOFTWARE\WOW6432Node\Khronos\Vulkan\Drivers') { "$k"; Get-Item $k -ErrorAction Continue | Format-List }
          Get-CimInstance Win32_VideoController | Format-List Name,DriverVersion
      - name: Configure
        run: python -I tools/build.py --env windows-x64 cmake --preset windows-x64 -DPATELLA_PLACEHOLDER_RESOURCES=ON
      - name: Build tests_vulkan
        run: python -I tools/build.py --env windows-x64 cmake --build --preset windows-x64 --target tests_vulkan
      - name: Does it open files of the data set
        shell: pwsh
        continue-on-error: true
        run: Get-ChildItem -Recurse -Include Tibia.* -File -Path . | Select-Object FullName
      - name: The test elevated, with the loader's log
        shell: pwsh
        continue-on-error: true
        env:
          VK_LOADER_DEBUG: error,warn,info,driver
        run: |
          $o = & build\windows-x64\tests\vulkan\Release\tests_vulkan.exe 2>&1
          "exit $LASTEXITCODE, $($o.Count) lines"
          $o | Select-Object -First 80
          $o | Select-Object -Last 12
      - name: The test at medium integrity, with the loader's log
        shell: pwsh
        continue-on-error: true
        env:
          VK_LOADER_DEBUG: error,warn,driver
        run: |
          python -I tools/sandbox.py normal-user -- build\windows-x64\tests\vulkan\Release\tests_vulkan.exe > medium.txt 2>&1
          "exit $LASTEXITCODE"
          Get-Content medium.txt | Select-Object -First 60
          Get-Content medium.txt | Select-Object -Last 40
      - name: The test through ctest at medium integrity
        run: python -I tools/sandbox.py normal-user -- python -I tools/build.py --env windows-x64 ctest --preset windows-x64 -R "^tests_vulkan$"
