# The hosted checks (issue #11; notes/modernization-plan.md, sections 4.1 and 4.7): GitHub's runners,
# nothing that reads a CipSoft file. Windows: MSVC x64 (preset windows-x64 without the client), Release and Debug;
# the full client and its test build (issue #127, PATELLA_PLACEHOLDER_RESOURCES=ON: linked with neutral generated
# pictures, since the real ones come from Tibia.exe, which CI never has; ctest runs the unit tests and the start
# without data); and the unit tests under MSVC's AddressSanitizer (issue #70, preset
# windows-x64-asan without the client, Release). Linux: the Docker image of docker/linux-x64 (GCC 16.2, Clang
# 22.1 with ASan and UBSan, clang-format and clang-tidy 22.1, CMake 4.4.5, Ninja 1.13.2), built from its pinned Dockerfile in each
# job: the presets linux-x64-gcc and linux-x64-clang, Release and Debug; the clang-format check; and
# clang-tidy against the findings baseline tools/tidy-baseline.tsv. notes/reconstruction.md, "Checking".
#
# It runs on pull requests too: it uses no secrets and no self-hosted runner (those are in
# self-hosted.yml, which never runs on a pull request). Third-party actions are pinned by commit. CMake is 4.4.5 in
# every job that runs it (issue #141): the Windows jobs unpack Kitware's zip (tools/build.py --install-cmake, its
# SHA-256 checked), the Linux jobs have the image's.

name: hosted

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hosted-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: patella-modern/linux-x64:gcc16.2-clang22.1-libstdcxx16-cmake4.4.5-ninja1.13.2-sdl3-mesa25.0.7

jobs:
  windows-msvc:
    name: windows-x64 (MSVC), unit tests
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Issue #141: CMake 4.4.5 everywhere. Kitware's windows-x86_64 zip, checked against tools/build.py's SHA-256,
      # not the runner's CMake; tools/build.py runs cmake and ctest from PATELLA_CMAKE_DIR and refuses another version.
      - name: CMake 4.4.5 (Kitware's release, SHA-256 checked)
        shell: pwsh
        run: |
          python -I tools/build.py --install-cmake "$env:RUNNER_TEMP\cmake"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "PATELLA_CMAKE_DIR=$env:RUNNER_TEMP\cmake" >> $env:GITHUB_ENV
          & "$env:RUNNER_TEMP\cmake\bin\cmake.exe" --version
      - name: Tool versions
        run: |
          python --version
          python -I tools/build.py --env windows-x64 cmake --version
      # tools/build.py sets up MSVC x64 (vcvarsall.bat) and fails on any compiler or linker warning.
      # cmake --workflow takes no -D, so the steps one by one: without Tibia.exe, no client. The builds
      # compile patella_core with MSVC's code analysis, /analyze (issue #63, cmake/Core.cmake): a finding
      # fails them like a warning.
      - name: Configure (PATELLA_CLIENT=OFF)
        run: python -I tools/build.py --env windows-x64 cmake --preset windows-x64 -DPATELLA_CLIENT=OFF
      - name: Build Release
        run: python -I tools/build.py --env windows-x64 cmake --build --preset windows-x64
      - name: Unit tests Release
        run: python -I tools/build.py --env windows-x64 ctest --preset windows-x64
      - name: Build Debug
        run: python -I tools/build.py --env windows-x64 cmake --build --preset windows-x64-debug
      - name: Unit tests Debug
        run: python -I tools/build.py --env windows-x64 ctest --preset windows-x64-debug

  windows-asan:
    name: windows-x64-asan (MSVC AddressSanitizer), unit tests
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Issue #141: CMake 4.4.5 everywhere. Kitware's windows-x86_64 zip, checked against tools/build.py's SHA-256,
      # not the runner's CMake; tools/build.py runs cmake and ctest from PATELLA_CMAKE_DIR and refuses another version.
      - name: CMake 4.4.5 (Kitware's release, SHA-256 checked)
        shell: pwsh
        run: |
          python -I tools/build.py --install-cmake "$env:RUNNER_TEMP\cmake"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "PATELLA_CMAKE_DIR=$env:RUNNER_TEMP\cmake" >> $env:GITHUB_ENV
          & "$env:RUNNER_TEMP\cmake\bin\cmake.exe" --version
      # Issue #70: the preset windows-x64-asan (cmake/Hardening.cmake, PATELLA_SANITIZE=address: /fsanitize=address,
      # the ASan runtime DLL next to each executable) without the client, Release: the unit tests under MSVC's
      # AddressSanitizer, every finding fatal. golden_runner is built and skipped (no corpus here: it is derived
      # from Tibia.exe and stays on the recording machine); its ASan run, and PatellaTest.exe's over the reference
      # recordings, are local gates (notes/reconstruction.md, "Checking").
      - name: Configure (PATELLA_CLIENT=OFF)
        run: python -I tools/build.py --env windows-x64-asan cmake --preset windows-x64-asan -DPATELLA_CLIENT=OFF
      - name: Build Release
        run: python -I tools/build.py --env windows-x64-asan cmake --build --preset windows-x64-asan
      - name: Unit tests Release
        run: python -I tools/build.py --env windows-x64-asan ctest --preset windows-x64-asan

  windows-client:
    name: windows-x64 (MSVC), the client and the test build, tests
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Issue #141: CMake 4.4.5 everywhere. Kitware's windows-x86_64 zip, checked against tools/build.py's SHA-256,
      # not the runner's CMake; tools/build.py runs cmake and ctest from PATELLA_CMAKE_DIR and refuses another version.
      # icacls (issue #163): the tests run at medium integrity (below), and Python's mkdtemp, where build.py unpacks it,
      # leaves a folder only SYSTEM, Administrators and its owner can open; S-1-5-32-545 is BUILTIN\Users.
      - name: CMake 4.4.5 (Kitware's release, SHA-256 checked)
        shell: pwsh
        run: |
          python -I tools/build.py --install-cmake "$env:RUNNER_TEMP\cmake"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          icacls "$env:RUNNER_TEMP\cmake" /grant "*S-1-5-32-545:(OI)(CI)RX" /T /Q
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "PATELLA_CMAKE_DIR=$env:RUNNER_TEMP\cmake" >> $env:GITHUB_ENV
          & "$env:RUNNER_TEMP\cmake\bin\cmake.exe" --version
      # The whole windows-x64 preset, Patella.exe and PatellaTest.exe linked, with neutral placeholder pictures
      # (issue #127, cmake/WindowsX64.cmake, tools/placeholder_resources.py: this runner has no Tibia.exe and never
      # gets it; the option refuses where a Tibia.exe exists). The configure fetches the pinned Vulkan dependencies and
      # SDL3. The all target also compiles each header of the client and the test build on its own (issue #49).
      - name: Configure (PATELLA_PLACEHOLDER_RESOURCES=ON)
        run: python -I tools/build.py --env windows-x64 cmake --preset windows-x64 -DPATELLA_PLACEHOLDER_RESOURCES=ON
      - name: Build Release (Patella.exe, PatellaTest.exe, the tests)
        run: python -I tools/build.py --env windows-x64 cmake --build --preset windows-x64
      # Only what needs no CipSoft data: the unit tests and start_without_data (a start in an empty folder ends with
      # the original's error box and exit code 1). The golden corpus and the data-file tests skip themselves here (no
      # corpus, no data files on this machine). tests_vulkan runs on the pinned CPU driver from its own synthetic pictures.
      # At medium integrity (issue #163): the runner's account is elevated, where the Vulkan loader ignores
      # VK_DRIVER_FILES, the only way the engine names the CPU driver.
      - name: Tests Release
        run: python -I tools/sandbox.py normal-user -- python -I tools/build.py --env windows-x64 ctest --preset windows-x64

  linux:
    name: ${{ matrix.preset }} (Docker), unit tests and the Linux client (placeholders)
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        preset: [linux-x64-gcc, linux-x64-clang]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the image (docker/linux-x64)
        run: docker build -t "$IMAGE" docker/linux-x64
      - name: CMake and Ninja of the image (issue #141: 4.4.5, 1.13.2)
        run: docker run --rm "$IMAGE" bash -c "cmake --version && ninja --version"
      # On Linux tools/build.py runs cmake --workflow itself, with its warning check. linux-x64-gcc
      # compiles patella_core with GCC's static analyzer, -fanalyzer (issue #63, cmake/Core.cmake): a
      # finding fails the build like a warning.
      - name: Release
        # Issue #131: the Linux client with neutral placeholder pictures (the runner has no Tibia.exe, as the Windows job's).
        run: docker run --rm -e PATELLA_PLACEHOLDER_RESOURCES=1 -v "$GITHUB_WORKSPACE:/work" -w /work "$IMAGE" python3 -I tools/build.py ${{ matrix.preset }}
      - name: Debug
        run: docker run --rm -e PATELLA_PLACEHOLDER_RESOURCES=1 -v "$GITHUB_WORKSPACE:/work" -w /work "$IMAGE" python3 -I tools/build.py ${{ matrix.preset }}-debug

  # The packages (issue #135, cmake/Package.cmake): the zip, the tarball and the AppImage, each only from a build of the
  # generated placeholder pictures (these runners have no Tibia.exe and never get one). The run's artifact holds them
  # and nothing else: no release, no tag, no upload elsewhere. tools/package_check.py proves each package has no CipSoft
  # file and carries the placeholders, then that it starts and ends at the original's error for a missing Tibia.dat.
  package-windows:
    name: package (Windows zip)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: CMake 4.4.5 (Kitware's release, SHA-256 checked)
        shell: pwsh
        run: |
          python -I tools/build.py --install-cmake "$env:RUNNER_TEMP\cmake"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "PATELLA_CMAKE_DIR=$env:RUNNER_TEMP\cmake" >> $env:GITHUB_ENV
      - name: The check's own test
        run: python -I tools/package_check.py --self-test
      - name: Configure, build Patella.exe, CPack (preset package-windows-x64)
        run: python -I tools/build.py package-windows-x64
      - name: tools/package_check.py on the zip
        shell: bash
        run: python -I tools/package_check.py build/package-windows-x64/packages/*.zip
      - name: The zip starts and ends at the original's error (no data files)
        shell: bash
        run: python -I tools/package_check.py --run build/package-windows-x64/packages/*.zip
      - name: The artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package-windows-x64
          path: build/package-windows-x64/packages/*.zip
          if-no-files-found: error
          retention-days: 14

  package-linux:
    name: package (Linux tarball and AppImage)
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the image (docker/linux-x64)
        run: docker build -t "$IMAGE" docker/linux-x64
      - name: The check's own test
        run: docker run --rm -v "$GITHUB_WORKSPACE:/work" -w /work "$IMAGE" python3 -I tools/package_check.py --self-test
      - name: Configure, build Patella, CPack (preset package-linux-x64)
        run: docker run --rm -v "$GITHUB_WORKSPACE:/work" -w /work "$IMAGE" python3 -I tools/build.py package-linux-x64
      - name: tools/package_check.py on the tarball and the AppImage
        run: docker run --rm -v "$GITHUB_WORKSPACE:/work" -w /work "$IMAGE" bash -c 'python3 -I tools/package_check.py build/package-linux-x64/packages/*.tar.gz build/package-linux-x64/packages/*.AppImage'
      - name: They start and end at the original's error (no data files, Xvfb)
        run: docker run --rm -v "$GITHUB_WORKSPACE:/work" -w /work "$IMAGE" bash -c 'python3 -I tools/package_check.py --run build/package-linux-x64/packages/*.tar.gz build/package-linux-x64/packages/*.AppImage'
      - name: The artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package-linux-x64
          path: |
            build/package-linux-x64/packages/*.tar.gz
            build/package-linux-x64/packages/*.AppImage
          if-no-files-found: error
          retention-days: 14

  clang-format:
    name: clang-format
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the image (docker/linux-x64)
        run: docker build -t "$IMAGE" docker/linux-x64
      - name: CMake and Ninja of the image (issue #141: 4.4.5, 1.13.2)
        run: docker run --rm "$IMAGE" bash -c "cmake --version && ninja --version"
      # Issue #153: the builds' retrying downloads against a local server (504s, a wrong file, the fallback); no network.
      - name: tools/download_selftest.py
        run: docker run --rm -v "$GITHUB_WORKSPACE:/work" -w /work "$IMAGE" python3 -I tools/download_selftest.py
      # The files of CLAUDE.md's check; .clang-format-ignore leaves src/Extern and tools/ out.
      - name: clang-format --dry-run --Werror
        run: >-
          docker run --rm -v "$GITHUB_WORKSPACE:/work" -w /work "$IMAGE" bash -c
          'clang-format --version && clang-format --dry-run --Werror src/*.cpp src/*.h src/compat/*.h src/types/*.h src/testmode/*.cpp src/testmode/*.h src/vulkan/*.cpp src/vulkan/*.h src/settings/*.cpp src/settings/*.h src/log/*.cpp src/log/*.h src/platform/*.cpp src/platform/*.h src/res/resource.h tests/unit/*.cpp tests/vulkan/*.cpp tests/golden/*.cpp tests/golden/*.h tests/fuzz/*.cpp tests/fuzz/*.h'

  banned-calls:
    name: banned C string calls
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Issue #57 (M4's exit): no strcpy, strcat, sprintf, vsprintf or gets in src/ (src/Extern aside); the
      # buffers write through TFixedString and TStringBuffer (src/types/FixedString.h). Issue #64: no FILE and no
      # fopen, fclose or printf family outside src/types/File.h (TFile).
      - name: tools/banned_calls.py
        run: python3 -I tools/banned_calls.py --self-test && python3 -I tools/banned_calls.py

  clang-tidy:
    name: clang-tidy (no new findings)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the image (docker/linux-x64)
        run: docker build -t "$IMAGE" docker/linux-x64
      - name: CMake and Ninja of the image (issue #141: 4.4.5, 1.13.2)
        run: docker run --rm "$IMAGE" bash -c "cmake --version && ninja --version"
      # The compile commands of linux-x64-clang (configure only): every source of src/ that builds on
      # Linux (patella_core), the Linux client's other sources (issue #160: those only it compiles; issue #164: those Windows
      # compiles too, whose Linux branches nothing else analyses; targets patella_tidy_linux_client, _test and _render;
      # --require fails when one is not in the database), and the headers of src/ they
      # include; with --headers, misc-include-cleaner
      # on each header of the preset's header checks as its own main file (issue #49). Fails on a finding that is not in
      # tools/tidy-baseline.tsv; checks only, never --fix. --zero bugprone- (issue #63): any bugprone-* finding
      # fails, whatever the baseline says (fixed, or a NOLINT with its reason). tools/tidy_ci.py runs this step
      # locally: it reads the single-quoted bash -c script below (issue #51), so keep it one quoted argument.
      - name: tools/tidy.py --baseline
        run: >-
          docker run --rm -v "$GITHUB_WORKSPACE:/work" -w /work "$IMAGE" bash -c
          'clang-tidy --version && PATELLA_PLACEHOLDER_RESOURCES=1 cmake --preset linux-x64-clang && python3 -I tools/tidy.py -p build/linux-x64-clang --all --headers --baseline tools/tidy-baseline.tsv --zero bugprone- --require src/platform/\*Linux\*.cpp --require src/platform/SdlPlatform.cpp --require src/SdlFrame.cpp --require src/Player.cpp --require src/Surface.cpp --require src/vulkan/SurfaceVulkan.cpp --require src/vulkan/WindowSystemSdl.cpp --require src/vulkan/DeviceSettings.cpp --require src/vulkan/Renderer.cpp --require src/vulkan/PresentWindow.cpp --require src/testmode/\*Win32.cpp'
