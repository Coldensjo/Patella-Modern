# The hosted checks (issue #11; notes/modernization-plan.md, sections 4.1 and 4.7): GitHub's runners,
# nothing that reads a CipSoft file. Windows: MSVC x64 (preset windows-x64 without the client, which
# needs Tibia.exe), Release and Debug; and the client's and the test build's sources compiled (issues #25,
# #46, PATELLA_CLIENT_COMPILE_ONLY: Patella.exe's and PatellaTest.exe's C and C++ sources, each with its own
# definitions, without the resource script, whose pictures come from Tibia.exe; never linked, never run). Linux: the Docker image of docker/linux-x64 (GCC 16.2, Clang
# 22.1 with ASan and UBSan, clang-format and clang-tidy 22.1), built from its pinned Dockerfile in each
# job: the presets linux-x64-gcc and linux-x64-clang, Release and Debug; the clang-format check; and
# clang-tidy against the findings baseline tools/tidy-baseline.tsv. notes/reconstruction.md, "Checking".
#
# It runs on pull requests too: it uses no secrets and no self-hosted runner (those are in
# self-hosted.yml, which never runs on a pull request). Third-party actions are pinned by commit.

name: hosted

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hosted-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: patella-modern/linux-x64:gcc16.2-clang22.1

jobs:
  windows-msvc:
    name: windows-x64 (MSVC), unit tests
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Tool versions
        run: |
          python --version
          cmake --version
      # tools/build.py sets up MSVC x64 (vcvarsall.bat) and fails on any compiler or linker warning.
      # cmake --workflow takes no -D, so the steps one by one: without Tibia.exe, no client.
      - name: Configure (PATELLA_CLIENT=OFF)
        run: python -I tools/build.py --env windows-x64 cmake --preset windows-x64 -DPATELLA_CLIENT=OFF
      - name: Build Release
        run: python -I tools/build.py --env windows-x64 cmake --build --preset windows-x64
      - name: Unit tests Release
        run: python -I tools/build.py --env windows-x64 ctest --preset windows-x64
      - name: Build Debug
        run: python -I tools/build.py --env windows-x64 cmake --build --preset windows-x64-debug
      - name: Unit tests Debug
        run: python -I tools/build.py --env windows-x64 ctest --preset windows-x64-debug

  windows-test-build:
    name: windows-x64 (MSVC), the client and the test build compiled
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The object libraries Patella_compile and PatellaTest_compile (cmake/WindowsX64.cmake): Patella.exe's
      # and PatellaTest.exe's sources, each with its own definitions (PatellaTest.exe's add
      # PATELLA_TEST_MODE), warnings (/WX) and hardening; the configure fetches the pinned Vulkan
      # dependencies (cmake/Vulkan.cmake). No Tibia.exe: no resources, no link.
      - name: Configure (PATELLA_CLIENT_COMPILE_ONLY=ON)
        run: python -I tools/build.py --env windows-x64 cmake --preset windows-x64 -DPATELLA_CLIENT_COMPILE_ONLY=ON
      - name: Compile the client (Patella_compile, Release)
        run: python -I tools/build.py --env windows-x64 cmake --build --preset windows-x64 --target Patella_compile
      - name: Compile the test build (PatellaTest_compile, Release)
        run: python -I tools/build.py --env windows-x64 cmake --build --preset windows-x64 --target PatellaTest_compile
      # Each header of the client and the test build compiled on its own with their settings (issue #49,
      # cmake/HeaderCheck.cmake); the other jobs build their presets' header checks with everything else.
      - name: Compile the headers on their own (header_check_client, header_check_test_build, Release)
        run: python -I tools/build.py --env windows-x64 cmake --build --preset windows-x64 --target header_check_client header_check_test_build

  linux:
    name: ${{ matrix.preset }} (Docker), unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        preset: [linux-x64-gcc, linux-x64-clang]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the image (docker/linux-x64)
        run: docker build -t "$IMAGE" docker/linux-x64
      # On Linux tools/build.py runs cmake --workflow itself, with its warning check.
      - name: Release
        run: docker run --rm -v "$GITHUB_WORKSPACE:/work" -w /work "$IMAGE" python3 -I tools/build.py ${{ matrix.preset }}
      - name: Debug
        run: docker run --rm -v "$GITHUB_WORKSPACE:/work" -w /work "$IMAGE" python3 -I tools/build.py ${{ matrix.preset }}-debug

  clang-format:
    name: clang-format
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the image (docker/linux-x64)
        run: docker build -t "$IMAGE" docker/linux-x64
      # The files of CLAUDE.md's check; .clang-format-ignore leaves src/Extern and tools/ out.
      - name: clang-format --dry-run --Werror
        run: >-
          docker run --rm -v "$GITHUB_WORKSPACE:/work" -w /work "$IMAGE" bash -c
          'clang-format --version && clang-format --dry-run --Werror src/*.cpp src/*.h src/compat/*.h src/types/*.h src/testmode/*.cpp src/testmode/*.h src/vulkan/*.cpp src/vulkan/*.h src/settings/*.cpp src/settings/*.h src/res/resource.h tests/unit/*.cpp tests/vulkan/*.cpp tests/golden/*.cpp tests/golden/*.h'

  banned-calls:
    name: banned C string calls
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Issue #57 (M4's exit): no strcpy, strcat, sprintf, vsprintf or gets in src/ (src/Extern aside); the
      # buffers write through TFixedString and TStringBuffer (src/types/FixedString.h). Issue #64: no FILE and no
      # fopen, fclose or printf family outside src/types/File.h (TFile).
      - name: tools/banned_calls.py
        run: python3 -I tools/banned_calls.py --self-test && python3 -I tools/banned_calls.py

  clang-tidy:
    name: clang-tidy (no new findings)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the image (docker/linux-x64)
        run: docker build -t "$IMAGE" docker/linux-x64
      # The compile commands of linux-x64-clang (configure only): every source of src/ that builds on
      # Linux (patella_core), and the headers of src/ they include; with --headers, misc-include-cleaner
      # on each header of the preset's header checks as its own main file (issue #49). Fails on a finding that is not in
      # tools/tidy-baseline.tsv; checks only, never --fix. tools/tidy_ci.py runs this step locally: it reads the
      # single-quoted bash -c script below (issue #51), so keep it one quoted argument.
      - name: tools/tidy.py --baseline
        run: >-
          docker run --rm -v "$GITHUB_WORKSPACE:/work" -w /work "$IMAGE" bash -c
          'clang-tidy --version && cmake --preset linux-x64-clang && python3 -I tools/tidy.py -p build/linux-x64-clang --all --headers --baseline tools/tidy-baseline.tsv'
