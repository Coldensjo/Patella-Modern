# The checks that need this repository's own machine (issue #11; notes/modernization-plan.md, sections
# 4.1 and 4.7): they read Tibia.exe and the data files, which never leave it, the frozen golden corpus and
# reference recordings (local data, never uploaded), and the local test server.
# - windows-x64: the x64 client (with its resources from Tibia.exe), the unit tests and the golden corpus's replay
#   (CTest test golden, which fails without a corpus here: PATELLA_GOLDEN_REQUIRE=ON), Release and Debug.
# - comparisons: capture-x86 (the 32-bit patcap.dll that the tools load into Tibia.exe, Patella-Modern issue #94),
#   then compare_traffic.py and compare_files.py against the test server for the x64 client, compare_rendering.py
#   (windowed) from compare_traffic.py's recording: its Vulkan engine on a GPU and on the CPU driver (issue #20);
#   testmode_check.py (issue #25) for the test build PatellaTest.exe; and the reference compare (tools/reference.py,
#   issue #23) of the frozen reference recordings. Every tool takes the x64 client by default since issue #94.
# - linux-docker: the Linux presets through tools/build.py in the local Docker image, with the golden corpus mounted
#   read-only (issue #91).
# Until issue #94 a job built the 32-bit oracle preset and ran its differential tests, and the golden job
# recorded the corpus from it before replaying it; the oracle left the fork, and the corpus is frozen (issue #93):
# the jobs replay the copy in PATELLA_GOLDEN_DIR (default C:\Tibia\Patella-Modern\build\golden) and compare against
# the reference set in PATELLA_REFERENCE_DIR (default C:\Tibia\Patella-Modern\build\reference), both read only.
#
# Safety (the repository goes public, D17): this workflow runs only on a push to this repository's
# branches and on workflow_dispatch, never on pull_request or pull_request_target, so code from a fork
# never reaches the runner. Every job also checks the repository's name (a fork's copy of this file
# never asks for this runner) and the repository variable PATELLA_SELF_HOSTED.
#
# The switch: until the variable PATELLA_SELF_HOSTED is "true" every job is skipped (not queued), so
# the workflow costs nothing while no runner is registered. To turn it on once the runner (labels
# self-hosted, Windows, X64, patella; a separate unprivileged Windows user, logged in, the runner started
# with run.cmd in that session, not as a service: the comparisons drive client windows) runs:
#	gh variable set PATELLA_SELF_HOSTED --body true --repo Coldensjo/Patella-Modern
# and off again with --body false (or gh variable delete). notes/reconstruction.md, "Checking", and
# notes/decisions.md, "CI (issue #11)".
#
# The CipSoft files come from the folder in the variable PATELLA_CIPSOFT_DIR (default C:\Tibia\Patella, the
# upstream Patella checkout with the original Tibia.exe and data files since the folder layout of November 4,
# 2026; notes/reconstruction.md, "The machine's folders") and are copied into the checkout's root, where
# .gitignore keeps them out of git; the checkout's git clean removes them again before the next run.
# Nothing is uploaded: no artifact, no cache.

name: self-hosted

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

# One machine, fixed ports (the test server's 7171 and 7172): one run at a time, none cancelled.
concurrency:
  group: self-hosted
  cancel-in-progress: false

env:
  CIPSOFT_DIR: ${{ vars.PATELLA_CIPSOFT_DIR || 'C:\Tibia\Patella' }}
  # CLAUDE.md: the 7.72 client of 2006-06-08.
  TIBIA_EXE_SHA256: 1a82fe97a39e536c29327d6d5dde316775f537dcc01506831429b1a0433b76f8

jobs:
  windows-x64:
    name: windows-x64 client, unit tests, golden corpus
    if: github.repository == 'Coldensjo/Patella-Modern' && vars.PATELLA_SELF_HOSTED == 'true' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: [self-hosted, Windows, X64, patella]
    timeout-minutes: 90
    env:
      PATELLA_GOLDEN_DIR: ${{ vars.PATELLA_GOLDEN_DIR || 'C:\Tibia\Patella-Modern\build\golden' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Copy the CipSoft files into the checkout
        shell: pwsh
        run: |
          foreach ($name in 'Tibia.exe', 'Tibia.dat', 'Tibia.spr', 'Tibia.pic', 'Tibia.cfg') {
            Copy-Item -LiteralPath (Join-Path $env:CIPSOFT_DIR $name) -Destination $name -ErrorAction Stop
          }
          $hash = (Get-FileHash -Algorithm SHA256 Tibia.exe).Hash.ToLowerInvariant()
          if ($hash -ne $env:TIBIA_EXE_SHA256) { throw "Tibia.exe is not the 7.72 client (sha256 $hash)" }
      # The configure takes PATELLA_GOLDEN_DIR from the environment (tests/golden/CMakeLists.txt); the corpus is
      # required here, and the runner checks it against its MANIFEST.tsv before it replays.
      - name: Configure windows-x64 (the golden corpus required)
        run: python -I tools/build.py --env windows-x64 cmake --preset windows-x64 -DPATELLA_GOLDEN_REQUIRE=ON
      - name: python -I tools/build.py windows-x64
        run: python -I tools/build.py windows-x64
      - name: python -I tools/build.py windows-x64-debug
        run: python -I tools/build.py windows-x64-debug

  comparisons:
    name: comparisons against Tibia.exe
    if: github.repository == 'Coldensjo/Patella-Modern' && vars.PATELLA_SELF_HOSTED == 'true' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: windows-x64
    runs-on: [self-hosted, Windows, X64, patella]
    timeout-minutes: 240
    env:
      PATELLA_REFERENCE_DIR: ${{ vars.PATELLA_REFERENCE_DIR || 'C:\Tibia\Patella-Modern\build\reference' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Copy the CipSoft files into the checkout
        shell: pwsh
        run: |
          foreach ($name in 'Tibia.exe', 'Tibia.dat', 'Tibia.spr', 'Tibia.pic', 'Tibia.cfg') {
            Copy-Item -LiteralPath (Join-Path $env:CIPSOFT_DIR $name) -Destination $name -ErrorAction Stop
          }
          $hash = (Get-FileHash -Algorithm SHA256 Tibia.exe).Hash.ToLowerInvariant()
          if ($hash -ne $env:TIBIA_EXE_SHA256) { throw "Tibia.exe is not the 7.72 client (sha256 $hash)" }
      # The checkout's git clean removed the earlier job's build tree: build the client again, and the 32-bit
      # patcap.dll for Tibia.exe (capture-x86).
      - name: python -I tools/build.py capture-x86
        run: python -I tools/build.py capture-x86
      - name: python -I tools/build.py windows-x64
        run: python -I tools/build.py windows-x64
      # The reference compare: PatellaTest.exe on each frozen session, no server (tools/reference.py).
      - name: reference.py compare
        run: python -I tools/reference.py compare --reference ${{ env.PATELLA_REFERENCE_DIR }}
      # compare_traffic.py starts and stops the test server itself (tools/testserver.py).
      - name: compare_traffic.py
        run: python -I tools/compare_traffic.py
      - name: compare_files.py
        run: python -I tools/compare_files.py
      # The fullscreen runs need a 1024x768x32 desktop (notes/reconstruction.md, "Test server").
      - name: compare_rendering.py (windowed)
        run: python -I tools/compare_rendering.py --modes windowed --recording build/traffic/result/orig-live.jsonl
      # The test mode's determinism check (issues #21, #22, #25): starts and stops the test server
      # itself, which must be stopped before it starts.
      - name: testmode_check.py (test build)
        run: python -I tools/testmode_check.py --exe build\windows-x64\Release\PatellaTest.exe
      - name: Stop the test server
        if: always()
        run: python -I tools/testserver.py stop --force

  linux-docker:
    name: Linux presets in Docker (tools/build.py), with the golden corpus
    if: github.repository == 'Coldensjo/Patella-Modern' && vars.PATELLA_SELF_HOSTED == 'true' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: [self-hosted, Windows, X64, patella]
    timeout-minutes: 90
    env:
      # tools/build.py mounts it read-only at /golden of the image (issue #91).
      PATELLA_GOLDEN_DIR: ${{ vars.PATELLA_GOLDEN_DIR || 'C:\Tibia\Patella-Modern\build\golden' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the image (docker/linux-x64)
        run: docker build -t patella-modern/linux-x64:gcc16.2-clang22.1 docker/linux-x64
      - name: python -I tools/build.py linux-x64-gcc
        run: python -I tools/build.py linux-x64-gcc
      - name: python -I tools/build.py linux-x64-clang
        run: python -I tools/build.py linux-x64-clang
